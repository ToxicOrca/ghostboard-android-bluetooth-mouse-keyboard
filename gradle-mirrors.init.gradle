// ============================================================================
//  GhostBoard HID Relay —— 国内网络加速用的 Gradle 初始化脚本（可选）
// ============================================================================
//
//  本文件不会改变仓库默认行为，只有显式传入 --init-script 时才生效。
//  国内直连 dl.google.com / services.gradle.org 经常超时，用阿里云镜像可以把
//  依赖解析速度从 ~30KB/s 提到 ~5MB/s。
//
//  用法：
//      ./gradlew :app:installDebug --init-script gradle-mirrors.init.gradle
//
//  或者把它拷到 ~/.gradle/init.gradle 让所有项目永久生效。
// ============================================================================

settingsEvaluated { settings ->
    // 1) 插件解析（AGP / Kotlin 插件本身）
    settings.pluginManagement.repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        gradlePluginPortal()
        google()
        mavenCentral()
    }

    // 2) 业务依赖解析（androidx / material / tinypinyin 等）
    settings.dependencyResolutionManagement.repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}
